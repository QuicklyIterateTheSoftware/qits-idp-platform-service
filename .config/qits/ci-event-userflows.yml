# The per-commit userflow run: `mvn verify` at the pushed commit — which regenerates
# service/target/userstories/ through the SIX story classes named below — and the reports published
# as one docs bundle, site @userflows/qits-platform-idp, version = the bare commit sha, branch
# riding as artifacts metadata for discovery.
#
# NON-GATING BY DESIGN, which is why it is a separate file from ci-post-receive.yml: this run going
# red must not cost the branch its image while "quality gate before merging" is still a decision to
# be taken — when it is, these per-commit runs are what the gate reads. One run per push per branch,
# collapsed to the newest tip under burst.
#
# WHAT THE STORIES ARE, because this repository's are the platform's own mirror image. Every sibling
# service carries a TokenValidationBootstrapIT proving the VALIDATING end of one story — it fetches
# this service's JWKS at startup and accepts a bearer signed by the key it found — and each of them
# has to stand a MockIdp where this service really is. This catalogue is that story with the mock
# taken out, told from the minting end. THERE IS NO MOCK AND NO STAND-IN IN THIS FILE'S RUN AT ALL —
# the idp is a leaf, it validates nothing against an OIDC tenant and dials only the postgres its own
# datasource names, so every story's far side is the caller and the caller is the test.
#
# SEVEN STORIES IN SIX CLASSES, all on ONE @TestProfile (stories/support/StoryProfile) and therefore
# in ONE launched process — two profiles would be two issuers, two databases and two signing keys:
#
#   api/TokenIssuanceBootstrapIT        two stories, category `authentication`, and the class that
#                                       owns the BOOT: it sorts first by fully-qualified name and
#                                       calls readiness before anything else. A shipped static
#                                       client presents its pair, the packaged issuer answers a
#                                       bearer, the key that signed it is on the document the
#                                       siblings fetch — and the wrong secret and an unentitled
#                                       audience are two different refusals.
#   stories/keys/BootstrapDocumentsIT   the two open documents the whole platform bootstraps from,
#                                       their derivation from the ONE issuer string, and the shipped
#                                       cache posture (no-store for the bearer, cacheable for the
#                                       documents, no max-age on either).
#   stories/commissioning/…Credential   a workspace commissions a credential, the container mints
#                                       with its owner's reach under its own identity, and
#                                       decommission stops it on the very next request.
#   stories/commissioning/…Refusals     what a commissioned credential may NOT do: commission
#                                       another (403), be seen or deleted by another owner (404) —
#                                       and the one thing it may, hand itself back (204).
#   stories/refusals/FrontDoorRefusals  six ways to be refused at POST /idp/token and four RFC 6749
#                                       codes, including a SHIPPED client with no secret, which is
#                                       unusable rather than open.
#   stories/refusals/ReservedRoleNames  a deployment that configured another client's minted
#                                       self-role: invalid_request, and the client mints nothing.
#
# ADD EVERY NEW STORY CLASS TO THE -Dit.test LIST BELOW IN THE SAME COMMIT: a class that is not
# named simply does not run here, and its story silently disappears from the published bundle while
# the build stays green.
#
# `user: build`, and NOT a switch inside the script: the IT hands the launched artifact an embedded
# postgres (the signing key lives in a database, which is the whole reason validation survives a
# restart), initdb refuses to run as root and calls getpwuid, so the step needs a passwd-backed
# non-root user — maven-base carries one (uid 1001), with cap-drop=ALL and no su to undo it, which
# nothing here wants. The step containers are Alpine, which is why service/pom.xml names zonky's
# -alpine binaries as a fourth arch; the `idp` module has no test sources and starts no postgres, so
# it names none. qits-eventstream's pipeline is the measured precedent for all of it.
#
# Quinoa is off (`-Dquarkus.quinoa=false` — the extension's root toggle; `.enabled` is silently
# ignored and npm still runs): the client is ci-post-receive.yml's business, where the
# qits-platform-spa-idp submodule is initialised and its lockfile origins are swapped against the
# platform's npm registry, and none of that ritual belongs here — the stories assert nothing about
# the SPA. It is also what keeps this step from needing the submodule at all: the daemon's clone
# does not recurse, so service/src/main/webui arrives EMPTY, and an empty directory is the one case
# Quinoa treats as a misconfiguration rather than as "no client" (docker/Dockerfile's `test -f`
# guard says the same thing from the other side). The packaged fast-jar failsafe boots is otherwise
# exactly what ships.
#
# THE TWO IT FLAGS ARE THE OTHER HALF, and they are why this repository does NOT opt its service
# module back into ITs the way qits-githost does. `skipITs` is true in the root pom and stays true;
# this module has SEVEN integration tests and six of them belong to this run — the six story classes
# above. The seventh does not:
#
#   IdpPackagedSurfaceIT      half about the CLIENT (the `<base href>`, the deep links, the SPA
#                             fallback that must not swallow a machine path), which the quinoa line
#                             above deliberately does not build. A blanket `-DskipITs=false` would
#                             make this quinoa-less run red on a test that is right. It also carries
#                             its OWN @TestProfile and its own database (idp_packaged_it), so
#                             running it here would launch a second issuer for nothing.
#
# Naming the classes keeps the opt-in to this pipeline and to these stories, and keeps the
# property's own meaning ("run everything") intact for the `native` profile that sets it.
#
# NO REPAIR WAS NEEDED to make the new test-scope jar resolve. This repository already carries
# `.qits-maven-settings.xml` and a `qits-maven` <repositories> entry — qits-db-core and
# qits-arch-rules have always come from the platform registry — so docker/Dockerfile's
# `-s .qits-maven-settings.xml … package -DskipTests` resolves qits-userflows there the same way it
# already resolved those two. (`-DskipTests` skips test EXECUTION, not test compilation, so the jar
# is fetched during an image build too; qits-userflows' transitive Playwright is a jar, not a
# browser — nothing downloads Chromium unless a story asks for a `Flow`, and neither of these does.)
#
# Loop review: this pipeline PUTs a docs bundle and pushes no commit — no cycle. The bundle goes to
# qits-artifacts and is read back by qits-docs, neither of which is this service. The one thing that
# could close a loop here is this service's own telemetry, and it cannot: the story runs against a
# launched process with `quarkus.otel.sdk.disabled=true`. Publish-if-absent: events redeliver and
# docs versions are immutable, so 409 is success (the qits-spa-ui-components release file's
# discipline).
event: SCMPublishCommit
when:
  - repoId: { exact: qits-platform-idp }
    suppressCi: { exact: "false" }
checkout:
  branch: branch
  sha: sha
steps:
  - image: qits/build-images/maven-base:latest
    user: build
    timeout-seconds: 2400
    script: |
      set -eu
      # The platform registry, exactly as qits-eventstream's step derives it: the pom's default
      # names a host-published address unreachable from a step container, and the exact-id mirror
      # in .qits-maven-settings.xml is what passes Maven's HTTP blocker.
      export QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL"
      ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL" \
        -Dquarkus.quinoa=false \
        -DskipITs=false \
        "-Dit.test=TokenIssuanceBootstrapIT,BootstrapDocumentsIT,CommissionedCredentialIT,CommissionRefusalsIT,FrontDoorRefusalsIT,ReservedRoleNamespaceIT"

      # `-C … .` so the story directories are the bundle's roots — nesting one directory deep would
      # put it in every served URL. The path is service/target/userstories because the stories live
      # in the deployable module; failsafe's working directory is that module's basedir.
      tar -czf userstories.tgz -C service/target/userstories .

      # Branch and commit ride as metadata (the docs store's exact-match discovery keys); the
      # version is the sha itself, so a bundle URL never changes meaning.
      status=$(curl -sS -o /tmp/docs-publish.out -w '%{http_code}' \
        -X PUT --data-binary @userstories.tgz \
        -H "X-Artifacts-Meta-git.branch.name: $QITS_CI_BRANCH" \
        -H "X-Artifacts-Meta-git.commit.hash: $QITS_CI_SHA" \
        -H "X-Artifacts-Meta-git.repository.name: qits-platform-idp" \
        "$QITS_DOCS_URL/@userflows/qits-platform-idp/-/$QITS_CI_SHA")
      case "$status" in
        201) echo "published userflows for qits-platform-idp@$QITS_CI_SHA ($QITS_CI_BRANCH)" ;;
        409) echo "userflows for qits-platform-idp@$QITS_CI_SHA already published — skipping" ;;
        *)   echo "docs publish failed: HTTP $status"; cat /tmp/docs-publish.out; exit 1 ;;
      esac
