# THE QA PIPELINE — this repository's only pipeline besides the release recipe, and it runs for
# RELEASE REQUESTS ALONE. It replaces ci-event-build.yml and ci-event-userflows.yml, both deleted in
# the commit that added this file. The reference template with the full argument is qits-ci's
# docs/ci-event-release-request.yml.
#
# Per-push CI is retired platform-wide: nothing builds a branch, because cd deploys what a RELEASE
# published rather than what a push built. qits-projects keeps, per open release request, a backing
# branch `release/<id>` — an octopus merge of the request's sources, refolded whenever the set
# changes — and publishes `ReleaseRequestChanged` on every successful re-fold. That branch is
# written by qits-githost's merge primitive, which fires no post-receive and therefore publishes no
# `SCMPublishCommit`: without this event the fold exists and nothing builds it.
#
# DECIDE AT MAIN, BUILD AT THE FOLD. The file is discovered, parsed and selected at this
# repository's `main` head; only the run's branch and sha come from the payload. So a release
# request cannot alter the CI that gates it by folding in a commit that edits this file.
#
# ONE FILE, TWO HALVES, and "a red verify must not cost the image" still holds — bought with
# ORDERING plus PER-STEP CLASSIFICATION rather than with two files that cannot share a verdict. The
# gating build is FIRST; the userflow half declares `gating: false`, which still fails the run and
# shows red but does not hold the fold for qits-projects' build gate. Keep it LAST: everything after
# a failing step is SKIPPED.
#
# THE SHA IMAGE IS GONE. The old build step ended in `docker push
# $QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-platform-idp:$QITS_CI_SHA`, the per-push coordinate cd
# keyed on; a fold's merged sha is not a coordinate anything could deploy. The image is still BUILT
# here under a local tag — the gate on the fold — and the CalVer coordinate is
# ci-event-release.yml's, untouched.
#
# THE MAINTENANCE RELEASE DOOR IS NOT HERE AND IS NOT MISSING. The old build file ended in a
# dangling comment about a `maintenance/*` push asking qits-workspaces to release the branch; the
# step it described was already gone, and qits-maintenance asks the door itself now, with its own
# credential, on the push that creates the bump. Nothing about that path goes through CI.
#
# Loop review: this pipeline PUTs a docs bundle and pushes no commit, no tag and no image — nothing
# the fold is made of changes, so it cannot re-trigger itself. Publish-if-absent: events redeliver
# and docs versions are immutable, so 409 is success.
event: ReleaseRequestChanged

when:
  # repoName, not repoId: since the identity cutover the git host's own coordinate is an opaque
  # UUID, so a name match belongs on the name. The event echoes the public name; a rename updates
  # this line in the same campaign. `suppressCi` went with the push event that carried it — a
  # release request is not a push and `-o qits.no-ci` has nothing to say about one.
  - repoName: { exact: qits-idp-platform-service }

checkout:
  branch: backingBranch
  sha: mergedSha

steps:
  # --- the GATING half: build the fold ------------------------------------------------------------
  # ci-event-build.yml's step, minus the push.
  - image: qits/build-images/node-docker-base:latest
    docker: true
    timeout-seconds: 3600
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this a failed docker build is
      # swallowed and the run reports SUCCESS — a green verdict for a fold that does not build is
      # exactly what a release gate must never be told. -u makes an unset registry variable stop the
      # step too.
      set -eu

      # $QITS_CI_BRANCH is release/<id> and $QITS_CI_SHA is the merged sha — the fold is already
      # checked out, so nothing here fetches or switches refs.
      #
      # The daemon's clone is shallow and does not recurse, so the qits-idp-platform-frontend submodule
      # at service/src/main/webui arrives as an empty directory — and Quinoa fails the image build
      # on exactly that (`No package.json found in Web UI directory`), if the Dockerfile's own
      # `test -f` guard has not stopped it first. Initialising it here rather than asking the daemon
      # to clone differently keeps the submodule this repo's business: it is a public GitHub repo
      # needing no credentials.
      frontend_url="${QITS_CI_REPOSITORY_URL%/*}/qits-idp-platform-frontend"
      git -c submodule.qits-idp-platform-frontend.url="$frontend_url" submodule update --init service/src/main/webui

      # THE LOCKFILE is the one file this step edits, and npm leaves no alternative. npm pins a full
      # resolved URL per package, and the SPA's lockfile is generated on the deployment host, so
      # every entry names an edge address that does not exist in this container. `npm ci` fetches
      # tarballs by that URL and never asks the configured registry for them, so the environment
      # below does not reach them: without this swap the install dies on connection refused. The
      # paths are identical on every address, so replacing the ORIGIN and keeping the path is all it
      # takes, and the integrity hashes are what make that safe — bytes from the other address must
      # still hash the same. The checkout is this step's own; nothing is edited that anyone will
      # read again.
      #
      # THE BYTE PLANE IS TWO SERVICES, WHICH IS WHY THE SWAP READS THE PATH. qits-platform-mirror
      # holds the npmjs pull-through cache; qits-artifacts hosts the @qits scope. No single origin
      # serves both, so the path is what tells them apart: an entry under the hosted registry's own
      # pathname — $QITS_NPM_REGISTRY_URL's — is a @qits tarball and gets the hosted origin, and
      # every other entry gets the proxy's.
      #
      # THE ORDER OF THE TWO EXPRESSIONS IS THE WHOLE TRICK. sed applies -e in sequence per line, so
      # the broad proxy swap runs FIRST and the narrow path-anchored one corrects the @qits entries
      # after it. The other order lets the broad expression undo the narrow one.
      #
      # npm's own knob for exactly this, `--replace-registry-host=always`, cannot do it against a
      # registry mounted under a path, and could not have told two registries apart either —
      # qits-workspaces' recipe measures that failure in full.
      cd service/src/main/webui
      npm_hosted_origin=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).origin')
      npm_proxy_origin=$(node -p 'new URL(process.env.QITS_NPM_PROXY_URL).origin')
      npm_hosted_path=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).pathname')
      sed -i -E \
        -e "s#(\"resolved\": \")https?://[^/\"]+#\1$npm_proxy_origin#" \
        -e "s#(\"resolved\": \")https?://[^/\"]+($npm_hosted_path)#\1$npm_hosted_origin\2#" \
        package-lock.json

      # ENVIRONMENT, not a file. qits-idp-platform-frontend COMMITS an .npmrc (the edge vhosts, right for
      # a developer on the deployment host), and npm ranks a project .npmrc ABOVE ~/.npmrc — so a
      # `cat > ~/.npmrc` preamble would be written and silently ignored. `npm_config_*` environment
      # outranks both files, so it wins without touching the submodule's tree.
      env npm_config_registry="$QITS_NPM_PROXY_URL" \
          "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
          npm ci --no-audit --no-fund

      # dist/qits-platform-spa-idp/browser — the bundle the image build consumes, and the ONE
      # artifact this half exists to produce. Lint and test are qits-idp-platform-frontend's own
      # pipeline's job; repeating them here would only make this repo red for someone else's commit.
      npm run build
      cd -

      # --- half two: the image ------------------------------------------------------------------
      # --network host, NOT a custom network: buildkit (the builder format the platform targets — a
      # swarm cannot assume the legacy builder) refuses custom networks on a build. Host networking
      # is buildkit-supported, and the maven registry's host-published address is derived from the
      # same injected env, so no address is stated here. The build needs it now that this repo
      # depends on qits-db-core and qits-arch-rules.
      #
      # THE TAG IS LOCAL AND NOTHING IS PUSHED. The registry-qualified `:$QITS_CI_SHA` coordinate was
      # the per-push publication and it is retired with the push path; `docker: true` stays for the
      # daemon socket the build needs and for the pull auth the mirror-fronted base images need.
      ref="qits-platform-idp:$QITS_CI_SHA"
      # THE CREDENTIAL IS A SECRET MOUNT AND NEVER A BUILD ARG — an arg is recorded in the image
      # history. The launcher injects the run's commissioned idp client as
      # $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET; these two flags hand that
      # pair to the mounts on the Dockerfile's mvnw RUN, which is the only place it exists.
      # Unconditional on purpose: a missing env source is NOT an error — measured on buildx v0.36.1,
      # `--secret id=x,env=DOES_NOT_EXIST` builds green and the mounted variable is simply unset —
      # so these lines do nothing at all until a run carries the pair. (This repository is the
      # service that MINTS that credential, which changes nothing about how a build consumes one.)
      docker build --network host \
        --build-arg QITS_MAVEN_REPOSITORY_URL="http://$QITS_REGISTRY/artifacts/maven/maven" \
        --build-arg QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_CENTRAL_MIRROR_URL:-}" \
        --secret id=qits-client-id,env=QITS_COMMISSIONED_CLIENT_ID \
        --secret id=qits-client-secret,env=QITS_COMMISSIONED_CLIENT_SECRET \
        -t "$ref" -f docker/Dockerfile .
      # NO `docker rmi "$ref"`: on a CI host it frees nothing — the layers stay in the builder's
      # cache either way — while under the containerd image store it drops the last reference to
      # content a concurrent build of this same Dockerfile may still be resolving.

  # --- the NON-GATING half: verify the stories, and publish what the run observed -----------------
  # ci-event-userflows.yml's step, unchanged but for `gating: false`, which is the whole of what that
  # separate file was.
  #
  # `mvn verify` at the fold — which regenerates service/target/userstories/ through the SIX story
  # classes named below — and the reports published as one docs bundle, site
  # @userflows/qits-idp-platform-service, version = the merged sha, branch riding as artifacts
  # metadata for discovery.
  #
  # ONE STEP, BECAUSE STEPS SHARE NOTHING. Every step container clones the repository for itself, so
  # the gating step above cannot hand this one anything: the verify and the publish stay together.
  #
  # WHAT THE STORIES ARE, because this repository's are the platform's own mirror image. Every sibling
  # service carries a TokenValidationBootstrapIT proving the VALIDATING end of one story — it fetches
  # this service's JWKS at startup and accepts a bearer signed by the key it found — and each of them
  # has to stand a MockIdp where this service really is. This catalogue is that story with the mock
  # taken out, told from the minting end. THERE IS NO MOCK AND NO STAND-IN IN THIS STEP'S RUN AT ALL —
  # the idp is a leaf, it validates nothing against an OIDC tenant and dials only the postgres its own
  # datasource names, so every story's far side is the caller and the caller is the test.
  #
  # SEVEN STORIES IN SIX CLASSES, all on ONE @TestProfile (stories/support/StoryProfile) and therefore
  # in ONE launched process — two profiles would be two issuers, two databases and two signing keys:
  #
  #   api/TokenIssuanceBootstrapIT        two stories, category `authentication`, and the class that
  #                                       owns the BOOT: it sorts first by fully-qualified name and
  #                                       calls readiness before anything else. A shipped static
  #                                       client presents its pair, the packaged issuer answers a
  #                                       bearer, the key that signed it is on the document the
  #                                       siblings fetch — and the wrong secret and an unentitled
  #                                       audience are two different refusals.
  #   stories/keys/BootstrapDocumentsIT   the two open documents the whole platform bootstraps from,
  #                                       their derivation from the ONE issuer string, and the shipped
  #                                       cache posture (no-store for the bearer, cacheable for the
  #                                       documents, no max-age on either).
  #   stories/commissioning/…Credential   a workspace commissions a credential, the container mints
  #                                       with its owner's reach under its own identity, and
  #                                       decommission stops it on the very next request.
  #   stories/commissioning/…Refusals     what a commissioned credential may NOT do: commission
  #                                       another (403), be seen or deleted by another owner (404) —
  #                                       and the one thing it may, hand itself back (204).
  #   stories/refusals/FrontDoorRefusals  six ways to be refused at POST /idp/token and four RFC 6749
  #                                       codes, including a SHIPPED client with no secret, which is
  #                                       unusable rather than open.
  #   stories/refusals/ReservedRoleNames  a deployment that configured another client's minted
  #                                       self-role: invalid_request, and the client mints nothing.
  #
  # ADD EVERY NEW STORY CLASS TO THE -Dit.test LIST BELOW IN THE SAME COMMIT: a class that is not
  # named simply does not run here, and its story silently disappears from the published bundle while
  # the build stays green.
  #
  # `user: build`, and NOT a switch inside the script: the IT hands the launched artifact an embedded
  # postgres (the signing key lives in a database, which is the whole reason validation survives a
  # restart), initdb refuses to run as root and calls getpwuid, so the step needs a passwd-backed
  # non-root user — maven-base carries one (uid 1001), with cap-drop=ALL and no su to undo it, which
  # nothing here wants. The step containers are Alpine, which is why service/pom.xml names zonky's
  # -alpine binaries as a fourth arch; the `idp` module has no test sources and starts no postgres, so
  # it names none. qits-eventstream's pipeline is the measured precedent for all of it.
  #
  # Quinoa is off (`-Dquarkus.quinoa=false` — the extension's root toggle; `.enabled` is silently
  # ignored and npm still runs): the client is the gating step's business, where the
  # qits-idp-platform-frontend submodule is initialised and its lockfile origins are swapped against the
  # platform's npm registry, and none of that ritual belongs here — the stories assert nothing about
  # the SPA. It is also what keeps this step from needing the submodule at all: the daemon's clone
  # does not recurse, so service/src/main/webui arrives EMPTY, and an empty directory is the one case
  # Quinoa treats as a misconfiguration rather than as "no client" (docker/Dockerfile's `test -f`
  # guard says the same thing from the other side). The packaged fast-jar failsafe boots is otherwise
  # exactly what ships.
  #
  # THE TWO IT FLAGS ARE THE OTHER HALF, and they are why this repository does NOT opt its service
  # module back into ITs the way qits-githost does. `skipITs` is true in the root pom and stays true;
  # this module has SEVEN integration tests and six of them belong to this run — the six story classes
  # above. The seventh does not:
  #
  #   IdpPackagedSurfaceIT      half about the CLIENT (the `<base href>`, the deep links, the SPA
  #                             fallback that must not swallow a machine path), which the quinoa line
  #                             above deliberately does not build. A blanket `-DskipITs=false` would
  #                             make this quinoa-less run red on a test that is right. It also carries
  #                             its OWN @TestProfile and its own database (idp_packaged_it), so
  #                             running it here would launch a second issuer for nothing.
  #
  # Naming the classes keeps the opt-in to this pipeline and to these stories, and keeps the
  # property's own meaning ("run everything") intact for the `native` profile that sets it.
  - image: qits/build-images/maven-base:latest
    user: build
    gating: false
    timeout-seconds: 2400
    script: |
      set -eu
      # The platform registry, exactly as qits-eventstream's step derives it: the pom's default
      # names a host-published address unreachable from a step container, and the exact-id mirror
      # in .qits-maven-settings.xml is what passes Maven's HTTP blocker.
      export QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL"
      # Maven Central through the platform mirror's in-network alias — empty (an older qits-ci that
      # injects nothing, or a deployment that turned the mirror plane off) deactivates the settings
      # profile and Central is resolved directly.
      export QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}"
      ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL" \
        -Dquarkus.quinoa=false \
        -DskipITs=false \
        "-Dit.test=TokenIssuanceBootstrapIT,BootstrapDocumentsIT,CommissionedCredentialIT,CommissionRefusalsIT,FrontDoorRefusalsIT,ReservedRoleNamespaceIT"

      # `-C … .` so the story directories are the bundle's roots — nesting one directory deep would
      # put it in every served URL. The path is service/target/userstories because the stories live
      # in the deployable module; failsafe's working directory is that module's basedir.
      tar -czf userstories.tgz -C service/target/userstories .

      # Branch and commit ride as metadata (the docs store's exact-match discovery keys); the
      # version is the merged sha itself, so a bundle URL never changes meaning.
      status=$(curl -sS -o /tmp/docs-publish.out -w '%{http_code}' \
        -X PUT --data-binary @userstories.tgz \
        -H "X-Artifacts-Meta-git.branch.name: $QITS_CI_BRANCH" \
        -H "X-Artifacts-Meta-git.commit.hash: $QITS_CI_SHA" \
        -H "X-Artifacts-Meta-git.repository.name: qits-idp-platform-service" \
        "$QITS_DOCS_URL/@userflows/qits-idp-platform-service/-/$QITS_CI_SHA")
      case "$status" in
        201) echo "published userflows for qits-idp-platform-service@$QITS_CI_SHA ($QITS_CI_BRANCH)" ;;
        409) echo "userflows for qits-idp-platform-service@$QITS_CI_SHA already published — skipping" ;;
        *)   echo "docs publish failed: HTTP $status"; cat /tmp/docs-publish.out; exit 1 ;;
      esac
