# idp config defaults, shipped from this library jar. Library jars ship defaults as
# META-INF/microprofile-config.properties (ordinal 100) — a jar's application.properties is ignored
# — read by whichever app pulls the jar in. The consuming app / env overrides any of these.
#
# idp owns its OWN named datasource + persistence unit + Flyway lineage: a postgres database of its
# own. Nothing else may share it: the signing key lives there, and that database is the only reason
# a token issued before a restart still verifies after one.
#
# THE THREE KEYS BELOW ARE THE PLATFORM'S GENERIC RESOURCE CONTRACT. A repository declares
# `resources: postgresql:db` in .config/qits/deployments.yml; qits-platform-deployments creates the
# role and the database before the successor container starts and injects QITS_RESOURCE_DB_URL /
# _USERNAME / _PASSWORD into it. Nothing here is idp-specific — an application maps the generic
# variables in its own shipped defaults, which is what keeps the deployer framework-agnostic. This
# service is a CORE SEED service, so at bootstrap the same triple arrives from the CLI instead: it
# provisions the database over plain JDBC before a deployer exists. Either way this jar reads one
# contract and does not know which side filled it.
#
# THE TRIPLE HAS NO DEFAULTS AND THAT IS THE REFUSE-TO-BOOT STANCE. An unset variable leaves these
# expressions unresolvable, so the process dies at Flyway's migrate-at-start naming the missing
# variable rather than opening some fallback store nobody meant. There is no local file to fall back
# to any more, and for this service the stake is the highest on the platform: an idp that came up
# against a store nobody meant would generate a NEW signing key and invalidate every token in
# flight, everywhere, with nothing in any log to say why.
quarkus.datasource.idp.db-kind=postgresql
quarkus.datasource.idp.jdbc.url=${QITS_RESOURCE_DB_URL}
quarkus.datasource.idp.username=${QITS_RESOURCE_DB_USERNAME}
quarkus.datasource.idp.password=${QITS_RESOURCE_DB_PASSWORD}

# A dedicated persistence unit bound to the idp datasource, owning only this module's entities.
quarkus.hibernate-orm.idp.datasource=idp
quarkus.hibernate-orm.idp.packages=eu.wohlben.qits.idp.entity

# Own Flyway lineage at a distinct classpath location. ONE lineage: the move to postgres is a clean
# start, so there is a single V1 and no history inherited from the H2 lineage.
#
# baseline-on-migrate is GONE with that lineage. It told Flyway to adopt a non-empty schema it had
# no history table for, which the H2 file needed while it was being adopted; every database this
# code now meets is either empty or was created by this very lineage, and the flag would only mask
# the one case worth failing on — a schema somebody else put there.
quarkus.flyway.idp.migrate-at-start=true
quarkus.flyway.idp.locations=classpath:db/idp/migration

# --- the issuer ----------------------------------------------------------------------------------
#
# The `iss` of every token and the base every advertised endpoint is derived from: the discovery
# document names <issuer>/token and <issuer>/jwks, so this one value moves them together. It is the
# URL a CONSUMER configures as its OIDC auth-server-url, which is why it carries the /idp segment
# this service serves under.
#
# The qits-net default is what local-up and the platform's own deployment use — services reach the
# idp directly on the network rather than through the gateway. The host is the repository name,
# because that is how a platform service is dialed. A deployment whose consumers sit elsewhere
# overrides it (QITS_IDP_ISSUER), and then every consumer must be told the same string: an issuer
# mismatch is rejected at validation, which is the intended loud failure.
qits.idp.issuer=http://qits-platform-idp:8080/idp

# How long an issued token is good for. Short on purpose — quarkus-oidc-client caches and refreshes
# on the consumer side, so the cost of a small number is a token fetch, and the benefit is that a
# deregistered phase-2 agent loses access within the window.
qits.idp.token-ttl-seconds=300

# The RSA modulus size for a key this service GENERATES. Existing keys are used as they are stored,
# so changing this rotates nothing by itself.
qits.idp.signing-key-bits=2048

# --- static clients ------------------------------------------------------------------------------
#
# The long-lived service clients. Config is the whole registry in phase 1 — the idp_client table is
# for phase 2's dynamic agent clients and is empty.
#
#   qits.idp.clients                        the client ids that exist, comma-separated. A
#                                           `client_id` that is not on this list is unknown, and an
#                                           unknown id never reaches a config lookup — which is what
#                                           keeps an attacker-supplied id out of the key namespace.
#   qits.idp.client.<id>.secret             the shared secret. ABSENT OR BLANK MEANS UNUSABLE, never
#                                           open: a client with no secret is refused
#                                           `invalid_client` like a wrong one. That is why no secret
#                                           is shipped below — a default secret would be a default
#                                           credential.
#   qits.idp.client.<id>.audiences          the `aud` values this client may ask for,
#                                           comma-separated. A request naming none gets ALL of them;
#                                           a request naming one outside the list is
#                                           `invalid_target`.
#   qits.idp.client.<id>.claims.<name>      a granted structured claim, copied into the token
#                                           verbatim. <name> is one of project, workspace, branch —
#                                           the contract's whole set; there are no scope strings.
#                                           `*` is a value like any other here: the idp states it,
#                                           and the resource service's own enforcement decides that
#                                           it matches everything.
#
# Every key above is env-overridable by the usual mangling —
# QITS_IDP_CLIENT_PROD_QITS_CI_SECRET, QITS_IDP_CLIENT_PROD_QITS_CI_AUDIENCES,
# QITS_IDP_CLIENT_PROD_QITS_CI_CLAIMS_PROJECT — and QITS_IDP_CLIENTS adds a client that is in no
# file.
#
# RESERVED FOR PHASE 2, read by nothing yet: qits.idp.client.<id>.grant.<name>, the registrar's
# granting template ("prod-qits-ci may mint clients whose project claim is anything", spelled `*`).
# It sits on the REGISTRAR's record because that is what the idp checks a registration against.
#
# AN ID IS PART OF THE KEY. Renaming a client means moving its `qits.idp.client.<id>.*` lines with
# it — a line left behind under the old id is read by nothing and says nothing about it.
#
# The ids are the names a service is DIALED by. A platform service is its repository name
# (qits-platform-artifacts); an environment service carries its environment
# (prod-qits-ci). qits-platform-deployments mints nothing, so it is no client here — it is an
# audience below, because qits-ci presents a token to its intake.
qits.idp.clients=prod-qits-ci,qits-platform-artifacts,prod-qits-workspaces,prod-qits-gateway

# The audience lists ship WIDE — every service client may ask for any platform audience — and that
# is a decision. Phase 1's job is to make identity assertable, not to narrow a call graph nobody has
# enumerated yet; a too-tight default fails a service adoption with `invalid_target` on a path no
# test here covers. Narrowing is a deployment change (QITS_IDP_CLIENT_<ID>_AUDIENCES) and should
# happen once the call graph is real. What the lists already do is bound the blast radius of a
# leaked secret to the platform's own services.
#
# The lists are LONGER than the client list on purpose: prod-qits-deployments is an audience with no
# client, because it receives tokens and mints none.
qits.idp.client.prod-qits-ci.audiences=prod-qits-ci,qits-platform-artifacts,prod-qits-workspaces,prod-qits-gateway,prod-qits-deployments
qits.idp.client.qits-platform-artifacts.audiences=prod-qits-ci,qits-platform-artifacts,prod-qits-workspaces,prod-qits-gateway,prod-qits-deployments
qits.idp.client.prod-qits-workspaces.audiences=prod-qits-ci,qits-platform-artifacts,prod-qits-workspaces,prod-qits-gateway,prod-qits-deployments
qits.idp.client.prod-qits-gateway.audiences=prod-qits-ci,qits-platform-artifacts,prod-qits-workspaces,prod-qits-gateway,prod-qits-deployments

# No `claims` are granted here, and no secrets. A deployment that wants qits-platform-artifacts'
# post-receive hook to reach qits-ci's event intake grants it the claim the intake enforces —
# QITS_IDP_CLIENT_QITS_PLATFORM_ARTIFACTS_CLAIMS_PROJECT='*' — and gives it a secret. Both are
# deployment facts; neither has a defensible default in a repository.
